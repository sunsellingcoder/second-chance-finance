<!DOCTYPE html>
<html>
<head>
    <title>Network Diagnostics</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .pass { background: #d4edda; }
        .fail { background: #f8d7da; }
        .pending { background: #fff3cd; }
    </style>
</head>
<body>
    <h1>Network Diagnostics</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        function addTest(name, status, message) {
            const div = document.createElement('div');
            div.className = `test ${status}`;
            div.innerHTML = `<strong>${name}:</strong> ${message}`;
            results.appendChild(div);
        }
        
        async function runTests() {
            addTest('Starting tests', 'pending', '...');
            
            // Test 1: Internet connectivity
            try {
                const response = await fetch('https://www.google.com', { mode: 'no-cors' });
                addTest('Internet connectivity', 'pass', 'Can reach internet');
            } catch (e) {
                addTest('Internet connectivity', 'fail', 'Cannot reach internet: ' + e.message);
            }
            
            // Test 2: DNS resolution
            addTest('DNS Test', 'pending', 'Testing DNS resolution...');
            try {
                // This will fail if DNS can't resolve
                await fetch('https://supabase.com', { mode: 'no-cors' });
                addTest('DNS Test', 'pass', 'Can resolve supabase.com');
            } catch (e) {
                addTest('DNS Test', 'fail', 'Cannot resolve supabase.com: ' + e.message);
            }
            
            // Test 3: Specific Supabase project
            addTest('Supabase Project', 'pending', 'Testing specific project URL...');
            try {
                const response = await fetch('https://fqxackkeigimakpkleds.supabase.co', { 
                    mode: 'no-cors',
                    cache: 'no-cache'
                });
                addTest('Supabase Project', 'pass', 'Can reach project URL');
            } catch (e) {
                addTest('Supabase Project', 'fail', 'Cannot reach project URL: ' + e.message);
            }
            
            // Test 4: Different Supabase endpoint
            addTest('Supabase API', 'pending', 'Testing Supabase API endpoint...');
            try {
                await fetch('https://api.supabase.com', { mode: 'no-cors' });
                addTest('Supabase API', 'pass', 'Can reach Supabase API');
            } catch (e) {
                addTest('Supabase API', 'fail', 'Cannot reach Supabase API: ' + e.message);
            }
            
            // Test 5: Check if it's a CORS issue
            addTest('CORS Test', 'pending', 'Testing with CORS request...');
            try {
                const response = await fetch('https://fqxackkeigimakpkleds.supabase.co/rest/v1/', {
                    method: 'GET',
                    headers: {
                        'apikey': 'test'
                    }
                });
                addTest('CORS Test', response.ok ? 'pass' : 'fail', 
                    `Status: ${response.status} ${response.statusText}`);
            } catch (e) {
                addTest('CORS Test', 'fail', 'CORS request failed: ' + e.message);
            }
        }
        
        runTests();
    </script>
</body>
</html>
